# AetherEMS-owned production override. Combine it with the matching AetherEdge
# Compose release so the generic API is wired to the energy-domain processor.
services:
  aether-load-forecasting-processor:
    profiles: ["data-processing"]
    image: ${AETHER_LOAD_FORECASTING_IMAGE:?set an immutable image reference with @sha256}
    container_name: aether-load-forecasting-processor
    ports:
      - "127.0.0.1:${AETHER_LOAD_FORECASTING_PORT:-8989}:8989"
    networks:
      - data-processing-local
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    labels:
      - "aetherems.role=data-processor"
      - "aetherems.description=Optional request-driven load forecasting processor"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8989"
      AETHER_LOAD_FORECASTING_REQUIRE_AUTH: "true"
      AETHER_LOAD_FORECASTING_BEARER_TOKEN: ${AETHER_LOAD_FORECASTING_BEARER_TOKEN:?set a unique processor bearer token}
      AETHER_LOAD_FORECASTING_MAX_CONCURRENCY: ${AETHER_LOAD_FORECASTING_MAX_CONCURRENCY:-1}
      AETHER_LOAD_FORECASTING_ARTIFACT_BUNDLES: ${AETHER_LOAD_FORECASTING_ARTIFACT_BUNDLES:?set commissioned artifact bundle JSON}
      NO_PROXY: "*"
      no_proxy: "*"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          body = json.load(urllib.request.urlopen("http://127.0.0.1:8989/v1/health", timeout=2));
          raise SystemExit(0 if body.get("status") == "ok" else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  aether-api:
    environment:
      AETHER_DATA_PROCESSING_ENABLED: "true"
      AETHER_DATA_PROCESSING_CONFIG: /app/data/config/data-processing/runtime.yaml
      AETHER_LOAD_FORECASTING_BEARER_TOKEN: ${AETHER_LOAD_FORECASTING_BEARER_TOKEN:?set the matching processor bearer token}

networks:
  data-processing-local:
    internal: true
